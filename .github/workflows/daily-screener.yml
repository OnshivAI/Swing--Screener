name: Daily swing screener

on:
  schedule:
        - cron: "47 12 * * 1-5"   # 12:47 UTC = 18:17 IST, Mon-Fri
  workflow_dispatch:           # "Run workflow" button for manual runs

permissions:
  contents: write              # needed to commit data/ back to the repo

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python screener.py
      - name: Save signal log and reports
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Screener run $(date -u +%F)"
          git push
